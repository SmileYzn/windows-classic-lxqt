[General]
# Cor de fundo da tela de logon. Padrão: #3A6EA5, a cor "Área de trabalho"
# do esquema Clássico (I386/HIVEDEF.INF, Control Panel\Colors\Background).
color=#3A6EA5

# Imagem de fundo opcional (caminho completo). Vazio = só a cor.
# Ex.: /usr/share/backgrounds/imagem.jpg
background=

# Como a imagem ocupa a tela: stretch, fill, fit, center ou tile
backgroundMode=stretch
