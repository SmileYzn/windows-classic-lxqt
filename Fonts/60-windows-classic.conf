<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Windows Classic: substitui as fontes da interface do Windows XP pela
  Noto Sans. Programas e documentos que pedem essas fontes (apps do Wine,
  páginas, arquivos do Office) passam a usar a Noto Sans.
-->
<fontconfig>
  <alias binding="same">
    <family>Tahoma</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>MS Sans Serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Microsoft Sans Serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>MS Shell Dlg</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>MS Shell Dlg 2</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
